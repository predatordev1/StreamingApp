apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-app-ingress
  namespace: {{ .Values.namespace.name }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:

      - path: /api/admin/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: adminservice-service
            port:
              number: 3003

      - path: /api/chat/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: chatservice-service
            port:
              number: 3004

      - path: /api/streaming/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: streamingservice-service
            port:
              number: 3002

      - path: /api/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: authservice-service
            port:
              number: 3001